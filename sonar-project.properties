# Parametres de l'analyse SonarCloud.
#
# Le scanner .NET (dotnet-sonarscanner) ne lit pas ce fichier : contrairement au scanner
# generique, il attend ses parametres en arguments /k, /o et /d. Le job sonar du workflow
# lit donc ce fichier et le traduit en arguments, pour que les valeurs ne soient ecrites
# qu'a un seul endroit.
#
# Consequence : ne mettre ici que des cles acceptees par le scanner .NET. sonar.sources et
# sonar.tests en sont exclues -- le scanner deduit le perimetre des projets MSBuild qu'il
# voit passer entre begin et end, et refuse qu'on les surcharge.

# Imposees par SonarCloud a la creation du projet : la cle est <compte>_<depot>.
sonar.projectKey=Medirial_Devops-net-ci
sonar.organization=medirial
sonar.projectName=Devops-net-ci

sonar.sourceEncoding=UTF-8

# Rapport produit par le job de tests. opencover est le seul format que le scanner .NET
# sait lire ; c'est deja celui que produit coverlet.runsettings. Avec le format par defaut
# de coverlet (cobertura), Sonar n'affiche aucune erreur et annonce 0 % de couverture.
sonar.cs.opencover.reportsPaths=coverage/**/coverage.opencover.xml

# Retire de l'analyse : les migrations sont generees par la CLI EF, ni ecrites a la main
# ni modifiables. Les signaler serait du bruit permanent.
sonar.exclusions=src/Migrations/**

# Retire du calcul de couverture seulement, donc toujours analyse : Program.cs est la
# racine de composition, la couvrir imposerait un test d'integration. Mise en coherence
# avec ExcludeByFile de coverlet.runsettings.
sonar.coverage.exclusions=src/Migrations/**,src/Program.cs
