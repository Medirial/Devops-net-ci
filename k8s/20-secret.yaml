# Valeur de developpement, versionnee volontairement pour que le depot se deploie en une
# commande. Ce n'est pas un mot de passe de production, et ce fichier ne doit jamais en
# contenir un.
#
# La creation reelle se fait en ligne de commande, sans passer par le depot :
#
#   kubectl -n taskapi create secret generic taskapi-secret \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 24)" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# La vraie limite du Secret, qu'il faut savoir enoncer : base64 n'est pas du chiffrement,
# c'est un encodage. Un Secret est stocke en clair dans etcd tant que le chiffrement au
# repos n'est pas active cote cluster, et quiconque peut lire les Secrets du namespace peut
# lire le mot de passe. Ce que le Secret apporte reellement : il n'est pas affiche par
# defaut dans les sorties de kubectl, il peut etre soumis a un RBAC distinct de celui des
# ConfigMaps, et il n'est pas ecrit sur le disque du noeud (montage en tmpfs).
#
# stringData plutot que data : la valeur est ecrite lisible, l'API se charge de l'encoder.
# Un mot de passe en base64 dans un fichier versionne donne la fausse impression d'etre
# protege.
apiVersion: v1
kind: Secret
metadata:
  name: taskapi-secret
  namespace: taskapi
type: Opaque
stringData:
  POSTGRES_PASSWORD: devonly
